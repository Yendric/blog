{{ template "header.html" .}}
<main class="container xl:max-w-3xl mx-auto w-full">
  <div class="prose dark:prose-invert max-w-none">
    {{ .Content }}
  </div>
  <ul class="mt-6">
    {{ range .Collections.post.SortByDate.Slice 0 3 }}
    {{ template "post-row" . }}
    {{ end }}
  </ul>
  <a href="/blog/"
    class="group inline-flex items-center gap-2 mt-6 rounded-lg border border-gray-200 dark:border-gray-700 px-4 py-2 font-medium text-gray-900 dark:text-white hover:border-gray-400 dark:hover:border-gray-500">
    View all posts
    <span aria-hidden="true" class="transition-transform group-hover:translate-x-0.5">&rarr;</span>
  </a>
</main>
{{ template "footer.html" .}}
