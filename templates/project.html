{{ template "header.html" .}}
<main class="container xl:max-w-3xl mx-auto prose dark:prose-invert">
  <h1>{{ .MetaData.title }}</h1>
  <div class="not-prose mb-8 flex flex-wrap items-center gap-x-4 gap-y-2 text-sm">
    <span class="text-gray-400 dark:text-gray-500 tabular-nums">{{ substr 0 4 .MetaData.date }}</span>
    {{ if .MetaData.tags }}
    <span class="flex flex-wrap gap-1.5">
      {{ range .MetaData.tags }}
      <span class="rounded-full bg-gray-100 dark:bg-gray-700 px-2.5 py-0.5 text-xs text-gray-600 dark:text-gray-300">{{ . }}</span>
      {{ end }}
    </span>
    {{ end }}
    {{ if .MetaData.link }}
    <a href="{{ .MetaData.link }}" target="_blank"
      class="text-gray-500 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white">Visit</a>
    {{ end }}
    {{ if .MetaData.github }}
    <a href="{{ .MetaData.github }}" target="_blank"
      class="text-gray-500 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white">GitHub</a>
    {{ end }}
  </div>
  {{ .Content }}
</main>
{{ template "footer.html" .}}
